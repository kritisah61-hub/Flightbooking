apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flight-db-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flight-db
  template:
    metadata:
      labels:
        app: flight-db
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: "flightms"
            - name: MYSQL_ROOT_PASSWORD
              value: "flightpass123"
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
            - name: database-script
              mountPath: /docker-entrypoint-initdb.d/01-database.sql
              subPath: database.sql
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: flight-db-storage
        - name: database-script
          configMap:
            name: flight-database-script
---
apiVersion: v1
kind: Service
metadata:
  name: flight-db
spec:
  selector:
    app: flight-db
  ports:
    - port: 3306
      targetPort: 3306
