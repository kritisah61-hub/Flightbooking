apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-booking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flight-booking
  template:
    metadata:
      labels:
        app: flight-booking
    spec:
      containers:
        - name: flight-booking
          image: flight-booking-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: DB_HOST
              value: "flight-db"
            - name: DB_NAME
              value: "flightms"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              value: "flightpass123"
---
apiVersion: v1
kind: Service
metadata:
  name: flight-booking-service
spec:
  type: NodePort
  selector:
    app: flight-booking
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
